<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><title>Paperly is offline</title>
<style>
:root{color-scheme:light dark}
html,body{margin:0;height:100%;font-family:system-ui,-apple-system,"Segoe UI",sans-serif;background:#fff;color:#0f2447}
@media (prefers-color-scheme:dark){html,body{background:#0b1220;color:#e8eefc}}
.c{display:flex;min-height:100%;flex-direction:column;align-items:center;justify-content:center;padding:32px;text-align:center;animation:in .3s ease both}
h1{font-size:1.4rem;margin:0 0 .5rem}p{margin:0 0 1.5rem;max-width:32ch;opacity:.8;line-height:1.5}
button{font:inherit;font-weight:600;border:0;border-radius:10px;padding:.8rem 1.6rem;background:#1d4ed8;color:#fff;transition:transform .15s ease}button:active{transform:scale(.97)}
@keyframes in{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
@media (prefers-reduced-motion:reduce){.c{animation:none}}
</style></head>
<body><div class="c"><h1>No connection</h1><p>Paperly needs the internet. Check your connection and try again.</p><button onclick="location.href='/'">Try again</button></div></body></html>
